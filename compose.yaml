# Settings come from .env (copy .env.example). Start: docker compose up -d --build
services:
  orcasaq:
    build: .
    image: footless-orcasaq-2-27b-p100:latest
    container_name: footless-orcasaq
    restart: unless-stopped
    init: true                # forwards docker stop (SIGTERM) to the server
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      PORT: ${PORT:-8080}
      MTP: ${MTP:-1}
      API_KEY: ${API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_REVISION: ${HF_REVISION:-}
    ports:
      - "${HOST:-0.0.0.0}:${PORT:-8080}:${PORT:-8080}"
    volumes:
      - ${MODELS_DIR:-./models}:/app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_DEVICE:-0}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import os, urllib.request; urllib.request.urlopen(f\"http://127.0.0.1:{os.environ.get('PORT', '8080')}/health\", timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      # the first start downloads ~12 GB before serving
      start_period: 2h
    stop_grace_period: 30s
